[tool.importlinter]
root_package = "codex_xhs"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "leaf modules stay pure (score/cookie_reader 无内部依赖)"
type = "independence"
modules = ["codex_xhs.score", "codex_xhs.cookie_reader"]

[[tool.importlinter.contracts]]
name = "server is top layer (任何模块不得依赖 server，防循环)"
type = "forbidden"
source_modules = ["codex_xhs"]
forbidden_modules = ["codex_xhs.server"]
