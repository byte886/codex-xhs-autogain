# Quality gates CI — GitHub Actions 模板
# 生成自 clean-code-gauntlet。
# 设计说明（落地 3 实测修正）：
#   · crapper/mutator/dryer 无 PyPI 包，需 vendor 克隆；CI 环境可直连 GitHub，
#     因此在 CI 内联克隆到 $RUNNER_TEMP/gauntlet/（项目外临时目录）。
#     【关键】工具必须 clone 在项目外：crapper 扫描源码时会把项目内的工具目录
#     当成项目一部分（会跑工具自带的测试套件，缺 bb/uml 等环境时直接失败）。
#     本机一键质检用 quality-check.sh（读 quality-gates/tools/<语言>.yaml 的 *_cmd，
#     vendor 在 gauntlet 仓库 tooling/vendor/，天然在项目外，无此问题）。
#   · 覆盖率/架构工具是 pip/npm/cargo 包，仍由 {{COV_*}}/{{ARCH_*}} 按语言注入。

name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  crap-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install crapper（vendor 模式，首跑自动建 .venv）
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git $RUNNER_TEMP/gauntlet/crapper
          cd $RUNNER_TEMP/gauntlet/crapper && ./crapper --help
      - name: CRAP gate（圈复杂度 ≤8 且 CRAP <30，见 gates.yaml）
        run: pip install pytest coverage && $RUNNER_TEMP/gauntlet/crapper/crapper

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mutator（vendor 模式；mutator 需 crapper 在相邻目录，且自用 .venv 跑 pytest）
        run: |
          git clone --depth 1 https://github.com/unclebob/crapper.git $RUNNER_TEMP/gauntlet/crapper
          git clone --depth 1 https://github.com/unclebob/mutator.git $RUNNER_TEMP/gauntlet/mutator
          cd $RUNNER_TEMP/gauntlet/mutator && ./mutator --help >/dev/null 2>&1 || true
          .venv/bin/pip install pytest coverage
      - name: 生成覆盖率基线（mutator 的覆盖率数据来自 crapper 产物，必须先跑 crapper；含语言测试依赖安装）
        run: pip install pytest coverage && $RUNNER_TEMP/gauntlet/crapper/crapper
      - name: Mutation gate（存活变异体 = 0；等价变异体人工核验后可豁免，见 EQUIVALENT-MUTANTS.md）
        run: |
          set +e
          $RUNNER_TEMP/gauntlet/mutator/mutator
          code=$?
          set -e
          if [ $code -eq 3 ] && [ -f EQUIVALENT-MUTANTS.md ]; then
            echo "→ 存活变异体均已人工核验为等价变异体（EQUIVALENT-MUTANTS.md），豁免"
            exit 0
          fi
          exit $code

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage.py
        run: pip install pytest coverage
      - name: Coverage gate（核心模块 ≥80%）
        run: coverage run -m pytest && coverage report --fail-under=80

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install import-linter
        run: pip install import-linter
      - name: Architecture gate（依赖违规 = 0、循环依赖 = 0）
        run: lint-imports
