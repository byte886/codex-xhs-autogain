# 工具映射表 — Python
# 生成器读取本文件，把实际工具与命令注入 ci.yml 与 quality-gates 说明。
# 字段：<维度>_tool / <维度>_install / <维度>_cmd；architecture 另含 config 文件名。

language: python

crap_tool: crapper
crap_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
crap_cmd: <GAUNTLET_DIR>/tooling/vendor/crapper/crapper
crap_ci_cmd: pip install pytest coverage && $RUNNER_TEMP/gauntlet/crapper/crapper

mutation_tool: mutator
mutation_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
mutation_cmd: <GAUNTLET_DIR>/tooling/vendor/mutator/mutator

coverage_tool: coverage.py
coverage_install: pip install pytest coverage
coverage_cmd: coverage run -m pytest && coverage report --fail-under=80

architecture_tool: import-linter
architecture_install: pip install import-linter
architecture_config: pyproject.toml  # [tool.importlinter] 契约：root_packages + include_external_packages + layers/forbidden
architecture_cmd: lint-imports

# DRY 维度（可选）：dryer（Bob 多语言版，支持 Python；已核验 README：--threshold 默认 0.82、--edn、--min-lines，跳过嵌套函数）
dry_tool: dryer
dry_install: bash <GAUNTLET_DIR>/tooling/bin/install-tools.sh && bash <GAUNTLET_DIR>/tooling/bin/patch-treesitter.sh
dry_cmd: <GAUNTLET_DIR>/tooling/vendor/dryer/dryer --edn src/

# 可选工具清单（社区备选，按需选用；主命令见上方 *_cmd，quality-check.sh 只跑主命令）
# 复杂度：radon（CC/CRAP 单工具）
# 覆盖率：pytest-cov（coverage.py 的 pytest 集成）
# 变异：mutmut（mutator 之外的 Python 生态）
# 架构：import-linter 主选；大型仓库可加 pydeps 做依赖可视化

note: "import-linter 契约在 pyproject.toml 的 [tool.importlinter] 下声明（root_packages + contracts）"
